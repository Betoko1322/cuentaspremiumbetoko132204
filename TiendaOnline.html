<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Beauty & Más</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
body{
background:
linear-gradient(rgba(255,255,255,.18),rgba(255,255,255,.18)),
url('https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?w=1600');
background-size:cover;
background-position:center;
background-attachment:fixed;
}
header{
margin:20px;
padding:35px;
text-align:center;
color:#fff;
background:rgba(255,79,154,.30);
backdrop-filter:blur(18px);
-webkit-backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,.35);
border-radius:22px;
box-shadow:0 15px 35px rgba(0,0,0,.15);
animation:fade .8s;
}
#buscar{
display:block;
width:85%;
max-width:700px;
margin:25px auto;
padding:14px 18px;
border:none;
border-radius:30px;
background:rgba(255,255,255,.28);
backdrop-filter:blur(18px);
-webkit-backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,.4);
box-shadow:0 10px 25px rgba(0,0,0,.12);
outline:none;
}
#productos{
width:95%;
margin:auto;
display:grid;
grid-template-columns:repeat(4,1fr);
gap:25px;
}
.card{
background:rgba(255,255,255,.20);
backdrop-filter:blur(18px);
-webkit-backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,.35);
border-radius:20px;
overflow:hidden;
box-shadow:0 15px 35px rgba(0,0,0,.12),inset 0 1px 1px rgba(255,255,255,.35);
transition:.4s;
}
.card:hover{
transform:translateY(-10px) scale(1.03);
background:rgba(255,255,255,.28);
box-shadow:0 25px 45px rgba(255,79,154,.30);
}
.card img{width:100%;height:220px;object-fit:cover;transition:.4s}
.card:hover img{transform:scale(1.08)}
.info{padding:16px}
.nombre{font-size:20px;color:#d81b72;font-weight:bold}
.desc{margin:10px 0;color:#333}
.precio{font-size:24px;font-weight:bold;color:#0b8b48}
select,button{
width:100%;
padding:10px;
margin-top:10px;
border-radius:10px;
border:none;
}
select{
background:rgba(255,255,255,.35);
backdrop-filter:blur(12px);
}
button{
background:linear-gradient(90deg,#ff4f9a,#ff7eb3);
color:#fff;
cursor:pointer;
transition:.3s;
}
button:hover{transform:scale(1.03)}
#carrito{
width:95%;
margin:40px auto;
padding:20px;
background:rgba(255,255,255,.18);
backdrop-filter:blur(18px);
-webkit-backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,.35);
border-radius:20px;
box-shadow:0 20px 40px rgba(0,0,0,.15);
}
#lista{
margin:15px 0;
padding:12px;
border:1px dashed rgba(255,255,255,.5);
border-radius:12px;
min-height:60px;
background:rgba(255,255,255,.08);
}
.botones{display:flex;justify-content:flex-end;gap:10px}
.botones button{width:180px}
#wa{background:#25D366}
footer{
margin:30px;
padding:20px;
text-align:center;
background:rgba(255,255,255,.15);
backdrop-filter:blur(18px);
border-radius:18px;
}
@keyframes fade{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:none}}
@media(max-width:1000px){#productos{grid-template-columns:repeat(2,1fr)}}
@media(max-width:650px){#productos{grid-template-columns:1fr}.botones{flex-direction:column}.botones button{width:100%}}
</style>
</head>
<body>
<header>
<h1>💄 Beauty & Más</h1>
<p>Bienvenido a nuestra tienda de belleza y cuidado personal.</p>
</header>
<input id="buscar" placeholder="🔍 Buscar producto...">
<section id="productos"></section>
<section id="carrito">
<h2>🛒 Carrito</h2>
<div id="lista">No hay productos agregados.</div>
<h3>Total: $0.00</h3>
<div class="botones">
<button>Vaciar</button>
<button id="wa">WhatsApp</button>
</div>
</section>
<footer>©2026 Beauty & Más</footer>
<script>
const nombres=["Labial Matte","Shampoo","Crema Facial","Perfume","Serum","Base","Rubor","Rímel"];
const precios=[150,220,180,450,280,320,175,210];
const cont=document.getElementById("productos");
nombres.forEach((n,i)=>{
cont.innerHTML+=`<article class="card">
<img src="https://picsum.photos/seed/belleza${i}/500/400">
<div class="info">
<div class="nombre">${n}</div>
<div class="desc">Producto premium para tu rutina de belleza.</div>
<div class="precio">$${precios[i]}</div>
<select><option>1</option><option>2</option><option>3</option><option>4</option></select>
<button>Agregar al carrito</button>
</div></article>`;
});
buscar.oninput=e=>{
document.querySelectorAll(".card").forEach(c=>{
c.style.display=c.innerText.toLowerCase().includes(e.target.value.toLowerCase())?"block":"none";
});
}
</script>
</body>
</html>
